name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  seal-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: seal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
  seal-python-and-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -r requirements-test.txt
      - run: python -I -B tests/offline_runner.py
      - run: python -m pytest -q python/tests
      - run: python scripts/check_source.py
      - run: python .github/scripts/check_ipm_manifest.py
      - run: python scripts/package_source.py
