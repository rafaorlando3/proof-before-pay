<style>
/* ---------- design tokens ---------- */
:root{
  --bg:#0b0f17;--surface:#121826;--surface-2:#182033;--surface-3:#1f2940;
  --text:#e9eef8;--text-2:#aab6cf;--text-3:#7d8aa6;--line:#243049;--line-2:#2f3d5c;
  --accent:#5aa2ff;--accent-ink:#06162e;--ok:#35d07f;--bad:#ff5d64;--warn:#ffb545;--info:#5aa2ff;
  --ok-bg:rgba(53,208,127,.14);--bad-bg:rgba(255,93,100,.14);--warn-bg:rgba(255,181,69,.16);--info-bg:rgba(90,162,255,.16);
  --radius:14px;--radius-s:9px;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --queue-w:340px;--header-h:56px;--dur:.18s;
}
@media (prefers-color-scheme: light){:root{
  --bg:#f3f5fa;--surface:#ffffff;--surface-2:#f0f3f9;--surface-3:#e6ebf5;
  --text:#0f1522;--text-2:#4b566d;--text-3:#73809a;--line:#dde3ee;--line-2:#cbd4e4;
  --accent:#1f6feb;--accent-ink:#ffffff;--ok:#15803d;--bad:#d1242f;--warn:#b45309;--info:#1f6feb;
  --ok-bg:rgba(21,128,61,.10);--bad-bg:rgba(209,36,47,.10);--warn-bg:rgba(180,83,9,.12);--info-bg:rgba(31,111,235,.10);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);
}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--accent)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:5;height:var(--header-h);display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;flex:0 0 auto;filter:drop-shadow(0 2px 6px rgba(79,156,255,.35))}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.1px;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.env{display:flex;gap:var(--s2);align-items:center;flex-wrap:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.badge.live{border-color:var(--ok);color:var(--ok)}.badge.live .dot{background:var(--ok)}
.badge.recorded{border-color:var(--warn);color:var(--warn)}.badge.recorded .dot{background:var(--warn)}
.badge.sandbox{border-color:var(--info);color:var(--info)}.badge.sandbox .dot{background:var(--info)}
.badge.stopped{border-color:var(--bad);color:var(--bad)}.badge.stopped .dot{background:var(--bad)}
.badge.user{color:var(--text-2)}
@media (max-width:900px){.brand .sub{display:none}.badge .lbl-long{display:none}}
@media (max-width:600px){.brand h1{display:none}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--queue-w) minmax(0,1fr);gap:var(--s4);padding:var(--s4);max-width:1560px;margin:0 auto;min-height:calc(100vh - var(--header-h))}
.queue{position:sticky;top:calc(var(--header-h) + var(--s4));align-self:start;height:calc(100vh - var(--header-h) - var(--s4)*2);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.queue-head{padding:var(--s3) var(--s3) var(--s2);border-bottom:1px solid var(--line)}
.queue-head .row1{display:flex;align-items:baseline;gap:var(--s2)}
.queue-head h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--text-3)}
.queue-head .count{font-size:12px;color:var(--text-3)}
.search{margin-top:var(--s2);display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);padding:0 10px;height:34px}
.search input{flex:1;border:0;background:transparent;color:var(--text);outline:none;min-width:0}
.search input::placeholder{color:var(--text-3)}
.filters{display:flex;gap:6px;margin-top:var(--s2);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 auto;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer}
.filter[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.filter .n{opacity:.75;margin-left:4px;font-weight:500}
.list{flex:1;overflow:auto;padding:var(--s2)}
.item{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 10px;border-radius:var(--radius-s);border:1px solid transparent;background:transparent;color:var(--text);cursor:pointer;transition:background var(--dur),border-color var(--dur)}
.item:hover{background:var(--surface-2)}
.item[aria-selected="true"]{background:var(--surface-2);border-color:var(--accent)}
.item .id{font-weight:700;font-size:13px}
.item .meta{grid-column:1/-1;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta b{color:var(--text-2);font-weight:600}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap;background:var(--surface-3);color:var(--text-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.info{background:var(--info-bg);color:var(--info)}
.empty{color:var(--text-3);padding:var(--s5);text-align:center;font-size:13px}
.empty code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:2px 6px;border-radius:6px}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column;gap:var(--s4)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
.kpi .k{font-size:12px;color:var(--text-3);margin-top:2px}
.kpi .k small{display:block;color:var(--text-3);opacity:.85}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:var(--s2);padding:12px 16px;border-bottom:1px solid var(--line)}
.card>.hd h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--text-3);font-weight:700}
.card>.bd{padding:14px 16px}
.case-hd{padding:16px 18px;display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.case-hd .title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.case-hd h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.case-hd .desc{flex:1 1 100%;color:var(--text-2);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.case-hd .desc span b{color:var(--text);font-weight:600}
.cta{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid transparent;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform var(--dur),filter var(--dur)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn.ghost{background:transparent;color:var(--text-2);border-color:var(--line-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn:hover:not(:disabled){filter:brightness(1.06)}

/* flow stepper */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px 16px}
.step{position:relative;padding:10px 10px 10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.step::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--text-3)}
.step .n{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.step .t{font-size:13px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .d{font-size:12px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done::before{background:var(--ok)}.step.now::before{background:var(--accent)}.step.now{border-color:var(--accent)}.step.bad::before{background:var(--bad)}.step.skip{opacity:.6}
@media (max-width:1100px){.flow{grid-template-columns:repeat(5,minmax(0,1fr))}.step .d{white-space:normal;overflow-wrap:anywhere}}

.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--s4)}
@media (max-width:1250px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.card{min-width:0}
#detail{overflow:hidden}

/* decision */
.decision .head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.decision .action{font-size:18px;font-weight:800;letter-spacing:-.2px;text-transform:capitalize}
.rationale{margin:10px 0 0;color:var(--text);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);font-weight:700}
.fact .v{font-size:13px;margin-top:3px;word-break:break-word}
.fact .v.mono{font-family:var(--mono);font-size:12px}
.fact.money .v{font-size:18px;font-weight:800}
.callout{border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;border:1px solid}
.callout.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.callout.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.callout.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 40%,transparent)}
.callout.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.callout b{font-weight:700}
.muted{color:var(--text-3)}.small{font-size:12px}.mono{font-family:var(--mono);font-size:12px;word-break:break-all}
details{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
details>summary{cursor:pointer;padding:9px 12px;font-weight:600;color:var(--text-2);list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--text-3);border-bottom:2px solid var(--text-3);transform:rotate(-45deg);transition:transform var(--dur);margin-left:2px}
details[open]>summary::before{transform:rotate(45deg)}
details>.in{padding:0 12px 12px}
pre{margin:0;background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:8px;overflow:auto;font-size:12px;max-height:340px;font-family:var(--mono)}
textarea{width:100%;min-height:220px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--mono);font-size:12px;resize:vertical}
input.note{width:100%;height:38px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:0 12px}

/* review */
.review{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.review .amount{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.review .amount .big{font-size:26px;font-weight:800;letter-spacing:-.4px}
.review .amount .to{color:var(--text-2)}
.review .commit{margin-top:8px}
.review .actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.verdict{padding:10px 12px;border-radius:10px;margin-top:10px;font-weight:700;font-size:13px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}.verdict.bad{background:var(--bad-bg);color:var(--bad)}.verdict.warn{background:var(--warn-bg);color:var(--warn)}

/* seals */
.seal{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.seal+.seal{margin-top:10px}
.seal.intact{border-left-color:var(--ok)}.seal.tampered,.seal.sealed_after_money_moved{border-left-color:var(--bad)}.seal.unverifiable{border-left-color:var(--warn)}
.seal .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seal .state{font-weight:800;font-size:13px;text-transform:capitalize}
.intact .state{color:var(--ok)}.tampered .state,.sealed_after_money_moved .state{color:var(--bad)}.unverifiable .state{color:var(--warn)}
.seal .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:170px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.tl li:last-child{border-bottom:0}
.tl .at{font-family:var(--mono);font-size:11px;color:var(--text-3);white-space:nowrap}
@media (max-width:700px){.tl li{grid-template-columns:1fr}}

/* tool trace */
.tool{display:flex;align-items:center;gap:8px;font-size:13px}
.tool .seq{width:20px;height:20px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text-2)}
.tool .name{font-family:var(--mono);font-weight:600}
.tool .ms{color:var(--text-3);font-size:12px;margin-left:auto}

/* mobile */
.tabs{display:none}
@media (max-width:980px){
  .app{grid-template-columns:1fr;padding:var(--s3);padding-bottom:76px}
  .queue{position:static;height:auto;max-height:none}
  .list{max-height:none}
  body[data-view="case"] .queue{display:none}
  body[data-view="queue"] .main{display:none}
  .tabs{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .tab{height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text-2);font-weight:700;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .case-hd h2{font-size:18px}
  .cta{margin-left:0;width:100%}
  .cta .btn{flex:1}
  .kpis{display:flex;overflow-x:auto;gap:8px;scrollbar-width:none;margin:0 calc(var(--s3)*-1);padding:0 var(--s3)}
  .kpis::-webkit-scrollbar{display:none}
  .kpi{flex:0 0 150px}
  .kpi .v{font-size:18px}
  body[data-view="case"] .kpis{display:none}
  .btn{height:44px}.btn.sm{height:44px}.filter{height:44px}#q,#note{min-height:44px}details>summary{min-height:44px}.item{padding:12px 10px;min-height:44px}
  .env{overflow-x:auto;scrollbar-width:none;max-width:70vw}

<script>
'use strict';
/* Same API contract as before: /pbp/api, X-PBP-Request header, JSON body, commitment in review body. */
const API = '/pbp/api';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = { current:null, commitment:'', me:{user:'',can_review:false}, filter:'all', q:'', cases:[], detailSig:'', detailRequest:0, health:null, notes:Object.create(null) };

async function api(path, opts){
  try{
    const r = await fetch(API+path, Object.assign({headers:{'Content-Type':'application/json','X-PBP-Request':'1'},signal:AbortSignal.timeout(15000)}, opts||{}));
    let j={}; try{ j = await r.json(); }catch(e){ return {ok:false, reason:'invalid_server_response'}; }
    if(!r.ok && !j.reason) j.reason = 'http_'+r.status;
    return j;
  }catch(e){ return {ok:false, reason:'connection_unavailable'}; }
}

/* ---------- vocabulary ---------- */
const REASONS = {
  decision_context_invalid:'the proposal cited evidence the tools did not return or its flags contradicted the policy; a person decides',
  evidence_reference_not_observed:'cited evidence that no tool returned', refund_flags_inconsistent:'a refund must move money and go to a reviewer',
  nonfinancial_action_moves_money:'a non-financial action cannot move money', action_not_supported_in_v1:'action outside the v1 contract',
  review_action_requires_human:'this action requires a reviewer', missing_evidence_requires_human:'evidence was missing, so a person decides',
  required_tool_not_observed:'the agent skipped a required tool', model_output_invalid:'the model did not return a valid decision',
  llm_call_failed:'the model call failed', agent_adapter_not_initialized:'live agent not configured (no key or model)',
  test_recipient_required:'a synthetic refund destination is missing or invalid', refund_payment_required:'the refund target (which Pix payment to return) was not identified; a person decides', payment_reference_mismatch:'the two payment references are not distinct or do not match the target', duplicate_evidence_required:'exactly two Pix payments are required for a duplicate refund', refund_cap_exceeded:'above the test-ledger cap', required_evidence_missing:'refund destination or order evidence missing',
  currency_mismatch:'currency not supported by the test ledger', unsupported_exception:'exception type not refundable in v1',
  payment_already_staged:'this Pix payment was already staged in another decision', human_required:'every refund needs a reviewer',
  permit_expired:'the single-use permit expired', ledger_authorization_expired:'this sealed refund review window expired; prepare a new case before approving', permit_binding_mismatch:'the request did not match the permit',
  authenticated_review_required:'the test ledger has not been authorized in a reviewer session', reviewed_version_changed:'the case changed since you opened it; reload',
  expected_commitment_required:'reload the case and approve again', review_forbidden:'your login lacks PBPReview:U',
  connection_unavailable:'the server did not answer', invalid_server_response:'the server answered with something that is not JSON'
};
function human(code){ if(!code) return ''; const c=String(code); for(const k of Object.keys(REASONS).sort((a,b)=>b.length-a.length)){ if(c.includes(k)) return REASONS[k]+' ('+esc(c)+')'; } return esc(c); }
const STATUS = {
  received:['Received','info'], rules_decided:['Decided by rules','info'], agent_requested:['Agent working','info'], agent_decided:['Agent decided','info'], agent_failed:['Agent failed','bad'],
  awaiting_human:['Awaiting human','warn'], human_approved:['Approved','ok'], human_rejected:['Rejected','bad'], permitted:['Permit issued','info'],
  effected:['Test effect done','ok'], closed:['Closed','ok'], closed_no_effect:['Closed, no effect','info'], blocked:['Blocked','bad'], rejected:['Rejected','bad'], sealed:['Sealed','info']
};
const stLabel = st => (STATUS[st]||[String(st||'').replace(/_/g,' '),''])[0];
const stTone  = st => (STATUS[st]||['', st&&st.startsWith('human_')?'ok':''])[1];
function money(min, cur){
  if(min==null || min==='') return '';
  const raw=String(min); if(!/^-?(0|[1-9][0-9]*)$/.test(raw)) return esc(raw);
  const n=BigInt(raw), a=n<0n?-n:n;
  return (n<0n?'-':'')+(a/100n).toLocaleString('en-US')+'.'+String(a%100n).padStart(2,'0')+' '+esc(cur||'');
}
function costLabel(micro, mode){
  // Honest labels: recorded replays cost nothing; live costs are estimated from tokens x price table (build 154 does not report cost); -1 = unknown.
  if(mode==='recorded') return 'none (recorded replay)';
  if(mode!=='live') return 'unknown provenance; stored metadata is not billing';
  if(micro==null || micro<0) return 'unknown (no price for this model)';
  return (micro/1e6).toFixed(5)+' USD (estimated from tokens x price table)';
}
const fmtTime = t => { if(!t) return ''; const d = new Date(t); return isNaN(d) ? esc(t) : d.toISOString().replace('T',' ').replace(/\.\d+Z$/,'Z'); };

/* ---------- header: environment ---------- */
async function loadHealth(){
  const h = await api('/health');
  if(!h.ok){ $('#env').innerHTML = `<span class="badge stopped"><span class="dot"></span>status unavailable: ${human(h.reason)}</span>`; return; }
  const w = await api('/whoami'); state.me = {user:w.user||'', can_review:!!w.can_review}; state.health = h;
  const live = h.mode==='live';
  const liveTxt=live ? `Live configured: ${esc(h.provider)} / ${esc(h.model)}${h.last_live_call_ok?' · last call verified':' · no live call verified'}` : 'Recorded decisions · no live inference';
  $('#env').innerHTML=`<span class="system-status"><span class="dot" style="background:${h.production_running?'var(--ok)':'var(--bad)'}"></span>${h.production_running?'System online':'System offline'}</span><span class="env-context">Test environment · ${live?'Live configured':'Recorded mode'}</span><details class="environment-details"><summary>Session details</summary><div class="in small"><p>${liveTxt}</p><p>Native IRIS Production: ${h.production_running?'running':'stopped'} · sandbox ledger only</p><p>Signed in as ${esc(state.me.user||'anonymous')}${state.me.can_review?' (reviewer)':''}</p><p>Workflow availability is not proof that every infrastructure health check passed.</p></div></details>`;

}

/* ---------- KPIs ---------- */
async function loadStats(){
  const s = await api('/stats');
  if(!s.ok){ $('#kpis').innerHTML = `<div class="kpi"><div class="v">—</div><div class="k">statistics unavailable: ${human(s.reason)}</div></div>`; return; }
  const bs=s.cases_by_status||{}, modes=s.model_decisions_by_mode||{};
  const total=Object.values(bs).reduce((a,b)=>a+b,0);
  const live=modes.live||{}, recorded=modes.recorded||{}, unknown=modes.unknown||{};
  const k=[
    [total,'cases'],[bs.awaiting_human||0,'awaiting a reviewer'],[s.seals||0,'local seals'],
    [s.effects||0,'sandbox effects'],[live.decisions??'—','live-path attempts','not a count of successful generations'],
    [recorded.decisions??'—','recorded decisions',`${unknown.decisions||0} older decisions have unknown mode; no billing verified`]
  ];
  $('#kpis').innerHTML = k.map(([v,l,sub])=>`<div class="kpi"><div class="v">${esc(v)}</div><div class="k">${esc(l)}${sub?`<small>${esc(sub)}</small>`:''}</div></div>`).join('');
}

/* ---------- queue ---------- */
const CASE_NAMES={duplicate_payment:'Duplicate Pix payment',duplicate_charge:'Duplicate charge',late_payment:'Late Pix payment',amount_mismatch:'Payment amount mismatch',refund_request:'Refund request',med_dispute:'Payment dispute',failed_withdrawal:'Withdrawal issue'};
const caseTitle=c=>CASE_NAMES[c.exception]||String(c.exception||'Payment exception').replace(/_/g,' ');
const FILTERS = [['all','All'],['awaiting_human','Awaiting human'],['blocked','Blocked'],['done','Closed']];
function matches(c){
  const f = state.filter;
  if(f==='awaiting_human' && c.status!=='awaiting_human') return false;
  if(f==='blocked' && !(c.status==='blocked' || c.status==='agent_failed' || c.status==='rejected' || c.status==='human_rejected')) return false;
  if(f==='done' && !/^(closed|closed_no_effect|effected|human_approved)$/.test(c.status)) return false;
  if(f==='agent' && !/agent/.test(c.status) && !/\(live|\(recorded/.test(c.reason||'')) return false;
  if(state.q){ const q = state.q.toLowerCase(); if(!(`${c.case_id} ${c.exception} ${c.reason} ${c.store} ${c.status}`).toLowerCase().includes(q)) return false; }
  return true;
}
function renderFilters(){
  const focused=document.activeElement?.classList?.contains('filter')?document.activeElement.dataset.f:null;
  const counts = {all:state.cases.length};
  for(const c of state.cases){ for(const [f] of FILTERS){ if(f==='all') continue; const save=state.filter, sq=state.q; state.filter=f; state.q=''; if(matches(c)) counts[f]=(counts[f]||0)+1; state.filter=save; state.q=sq; } }
  $('#filters').innerHTML = FILTERS.map(([f,l])=>`<button class="filter" type="button" aria-pressed="${state.filter===f}" data-f="${f}">${l}<span class="n">${counts[f]||0}</span></button>`).join('');
  document.querySelectorAll('.filter').forEach(b=> b.onclick = ()=>{ state.filter=b.dataset.f; renderList(); renderFilters(); });
  if(focused) Array.from(document.querySelectorAll('.filter')).find(b=>b.dataset.f===focused)?.focus({preventScroll:true});
}
function renderList(){
  const list = $('#list'); const top = list.scrollTop;
  const focusedId = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('item') ? document.activeElement.dataset.id : null;
  const rows = state.cases.filter(matches);
  $('#count').textContent = `${rows.length}${rows.length!==state.cases.length?' of '+state.cases.length:''}`;
  list.innerHTML = rows.length ? rows.map(c=>`<button type="button" class="item" role="option" aria-selected="${state.current===c.case_id}" data-id="${esc(c.case_id)}" id="item-${esc(c.case_id)}">
      <span class="business">${esc(caseTitle(c))}</span><span class="pill ${stTone(c.status)}">${esc(stLabel(c.status))}</span>
      <span class="meta"><b class="mono">${esc(c.case_id)}</b>${c.reason?' · '+(c.status==='blocked'?human(c.reason):esc(c.reason)):''}</span>
    </button>`).join('')
    : (state.cases.length ? '<div class="empty">No case matches this filter.</div>' : '<div class="empty">No cases yet. Feed the synthetic cases from the terminal:<br><code>Do ##class(pbp.Setup).FeedCases()</code></div>');
  list.scrollTop = top;
  document.querySelectorAll('.item').forEach(el=> el.onclick = ()=> openCase(el.dataset.id, true));
  if(focusedId){ const el = document.getElementById('item-'+focusedId); if(el) el.focus({preventScroll:true}); }
}
async function loadCases(){
  const r = await api('/cases?limit=200');
  if(!r.ok){ $('#count').textContent='unavailable'; $('#list').innerHTML = `<div class="empty">Could not load cases: ${human(r.reason)}</div>`; return; }
  state.cases = r.cases||[]; renderFilters(); renderList();
}
$('#q').addEventListener('input', e=>{ state.q = e.target.value.trim(); renderList(); });
$('#list').addEventListener('keydown', e=>{
  const items = [...document.querySelectorAll('.item')]; if(!items.length) return;
  let i = items.findIndex(x=>x.dataset.id===state.current);
  if(e.key==='ArrowDown'){ e.preventDefault(); i = Math.min(items.length-1, i+1); items[i].focus(); openCase(items[i].dataset.id,false); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); i = Math.max(0, i-1); items[i].focus(); openCase(items[i].dataset.id,false); }
  else if(e.key==='Enter' && i>=0){ openCase(items[i].dataset.id,true); }
});
function setView(v){ document.body.dataset.view = v; $('#tab-queue').setAttribute('aria-selected', v==='queue'); $('#tab-case').setAttribute('aria-selected', v==='case'); }

/* ---------- case detail ---------- */
function classify(d){
  const c=d.case, dec=d.decision, p=d.permit, rc=d.receipt;
  const headSeal=(d.seals||[]).find(s=>s.commitment===c.commitment)||null;
  const decisionSeal=(d.seals||[]).find(s=>s.commitment===dec?.commitment)||(d.seals||[]).find(s=>s.kind==='decision')||null;
  const ledgerBlocked=decisionSeal && /^blocked:/.test(decisionSeal.ledger_state||'') ? decisionSeal.ledger_state.replace(/^blocked:/,'') : '';
  const refusedMatch = dec && /did not return a valid decision \(([^)]*)\)/.exec(dec.rationale||'');
  const refused = dec && (dec.proposal_refused || refusedMatch) ? (dec.proposal_reason || (refusedMatch?refusedMatch[1]:'guard_refused')) : '';
  const kind = !dec ? 'none' : (dec.moves_money && !ledgerBlocked) ? 'money' : (dec.moves_money && ledgerBlocked) ? 'blocked' : 'review';
  const fin = d.review && typeof d.review==='object' ? d.review : null;
  return {c,dec,p,rc,headSeal,ledgerBlocked,refused,kind,fin};
}
function flow(x, d){
  const {c,dec,p,rc,refused,ledgerBlocked,kind} = x; const st=c.status; const seals=(d.seals||[]).length;
  const toolN = dec?.usage?.tool_calls||0; const src = dec?.source;
  const s1 = dec ? ['done','Evidence', src==='rules' ? 'rules, no tools' : `${toolN} tool call${toolN===1?'':'s'}`] : [st==='received'||st==='agent_requested'?'now':'', 'Evidence', st==='agent_requested'?'agent reading…':'waiting'];
  const s2 = !dec ? ['', 'Proposal', '—'] : refused ? ['bad','Proposal','refused by guard'] : src==='rules' ? ['skip','Proposal','n/a (rules)'] : ['done','Proposal', `${dec.model?.mode||''} ${dec.action}`.trim()];
  const intact=seals && d.seals.every(s=>s.verification?.state==='intact');
  const s3=seals ? [intact?'done':'bad','Seal',`${seals} record${seals===1?'':'s'}, ${intact?'intact':'verification needs attention'}`] : [dec?'now':'','Seal','not sealed'];
  const humanDone=/^(human_approved|human_rejected|permitted|effected|rejected)$/.test(st)||!!p||(d.events||[]).some(e=>e.kind==='human_approved'||e.kind==='human_rejected');
  const s4 = st==='awaiting_human' ? ['now','Review', kind==='money'?'approve or reject':'acknowledge'] : humanDone ? [st==='human_rejected'||st==='rejected'?'bad':'done','Review', st==='human_rejected'||st==='rejected'?'rejected':'approved'] : (dec && !dec.requires_human) ? ['skip','Review','not required'] : ['', 'Review', 'pending'];
  const s5 = rc ? [rc.verification==='intact'?'done':'bad','Test effect',rc.verification==='intact'?`${money(rc.amount_minor, rc.currency)} · ${rc.status}`:'receipt verification needs attention'] : ledgerBlocked ? ['bad','Test effect','ledger refused'] : p ? ['now','Test effect', p.status] : (dec && !dec.moves_money) ? ['skip','Test effect','no money'] : ['', 'Test effect', 'none'];
  return `<div class="flow" aria-label="Case flow">${[s1,s2,s3,s4,s5].map(([cls,t,dd],i)=>`<div class="step ${cls}"><div class="n">${i+1}</div><div class="t">${esc(t)}</div><div class="d">${esc(dd)}</div></div>`).join('')}</div>`;
}
function primaryCTA(x){
  const {c,kind} = x;
  if(c.status==='awaiting_human'){
    if(!state.me.can_review) return `<span class="pill warn">reviewer login required</span>`;
    return ''; // The review card is already first: keep one primary action, not a duplicate scroll button.
  }
  if(x.headSeal) return `<button class="btn ghost" data-tamper="${esc(x.headSeal.commitment)}" data-focus-seal="true">Try to tamper the seal</button>`;
  return '';
}
function sealCard(s){
  const st = s.verification?.state || 'unverifiable';
  return `<div class="seal ${st}" id="seal-${esc(s.commitment)}">
    <div class="hd"><span class="pill info">${esc(s.kind)}</span><span class="state">${esc(st.replace(/_/g,' '))}</span><span class="muted small">${fmtTime(s.sealed_at)}</span>${s.money_moved_before_seal?'<span class="pill bad">money moved before this seal</span>':''}${s.source?`<span class="pill">${esc(s.source)}</span>`:''}</div>
    <div class="mono small" style="margin-top:6px">${esc(s.commitment)}</div>
    <div class="small muted" style="margin-top:4px">prev ${s.prev?`<span class="mono">${esc(s.prev)}</span>`:'none (first record of the case)'} · bridge ${esc(s.verification?.bridge_state)} (${esc(s.verification?.reason)}) · anchored: ${s.verification?.on_chain_verified?'yes':'no (local chain of hashes)'}${s.ledger_state?' · test ledger at sealing: '+human(s.ledger_state):''}</div>
    <div class="acts"><button class="btn ghost sm" data-tamper="${esc(s.commitment)}">Try to tamper</button><button class="btn ghost sm" data-show-record="${esc(s.commitment)}">Show sealed record</button></div>
    <div id="tamper-${esc(s.commitment)}"></div></div>`;
}
function sig(d){ return JSON.stringify([d.case.status,d.case.reason,d.case.updated_at,d.case.commitment,(d.seals||[]).map(s=>[s.commitment,s.verification?.state,s.ledger_state]),d.permit?.status,d.receipt?.status,d.receipt?.verification,d.decision?.commitment,d.decision?.proposal_reason]); }
function bindActions(root=document){
  root.querySelectorAll('[data-set-view]').forEach(b=>b.onclick=()=>setView(b.dataset.setView));
  root.querySelectorAll('[data-focus-review]').forEach(b=>b.onclick=focusReview);
  root.querySelectorAll('[data-review-action]').forEach(b=>b.onclick=()=>submitReviewAction(b.dataset.reviewAction));
  root.querySelectorAll('[data-tamper]').forEach(b=>b.onclick=async()=>{await tamper(b.dataset.tamper);if(b.dataset.focusSeal) document.getElementById('seal-'+b.dataset.tamper)?.scrollIntoView({block:'center'});});
  root.querySelectorAll('[data-show-record]').forEach(b=>b.onclick=()=>showRecord(b.dataset.showRecord));
  root.querySelectorAll('[data-verify]').forEach(b=>b.onclick=()=>verify(b.dataset.verify));
}
function restoreDisclosures(keys){ document.querySelectorAll('#detail details').forEach(el=>{if(keys.includes(el.querySelector('summary')?.textContent.trim())) el.open=true;}); }

async function openCase(id, userAction){
  const previousNote = $('#note');
  if(state.current && previousNote) state.notes[state.current] = previousNote.value;
  const changed = state.current !== id;
  state.current = id;
  document.querySelectorAll('.item').forEach(el=> el.setAttribute('aria-selected', el.dataset.id===id));
  if(userAction && window.matchMedia('(max-width:980px)').matches) setView('case');
  const request=++state.detailRequest;
  const d = await api('/cases/'+encodeURIComponent(id));
  if(state.current!==id || request!==state.detailRequest) return;
  if(!d.ok){ state.detailSig=''; $('#detail').innerHTML = `<div class="empty">${human(d.reason)}</div>`; return; }
  rememberWindows(d);
  const s = sig(d); if(!changed && s===state.detailSig){ refreshWindows(); return; } state.detailSig = s;
  const x = classify(d); const {c,dec,p,rc,refused,ledgerBlocked,kind} = x;
  state.commitment = c.commitment || '';
  const missing = dec && dec.missing ? Object.keys(dec.missing) : [];
  const cur = c.input?.currency || p?.currency || rc?.currency || '';
  const dest = c.input?.recipient_ref || p?.recipient || rc?.recipient || '';
  const scrollY = window.scrollY;
  const pendingNote = state.notes[id] || '';
  const openDetails=!changed ? Array.from(document.querySelectorAll('#detail details[open]')).map(el=>el.querySelector('summary')?.textContent.trim()) : [];
  const noteFocused=!changed && document.activeElement?.id==='note';

  $('#detail').innerHTML = `
  <div class="case-hd">
    <div class="title"><h2>${esc(caseTitle(c))}</h2><span class="pill ${stTone(c.status)}">${esc(stLabel(c.status))}</span></div>
    <div class="cta">${primaryCTA(x)}</div>
    <div class="desc"><span class="mono">${esc(c.case_id)}</span><span>store ${esc(c.store)}</span><span>policy ${esc(c.policy?.id)} v${esc(c.policy?.version)}</span>${c.input?.environment?`<span>environment <b>${esc(c.input.environment)}</b></span>`:''}${c.reason?`<span class="muted">${c.status==='blocked'?human(c.reason):esc(c.reason)}</span>`:''}</div>
  </div>
  ${flow(x,d)}
  <div class="cols" style="padding:0 16px 16px">
   <div class="stack">
    ${c.status==='awaiting_human' ? reviewCard(x, cur, dest) : ''}
    <section class="card decision"><div class="hd"><h3>Decision</h3>${dec?`<span class="pill ${dec.source==='rules'?'info':'warn'}">${esc(dec.source)}${dec.model?.mode?' · '+esc(dec.model.mode):''}</span>`:''}</div><div class="bd">
     ${dec ? `
      <div class="head"><span class="action">${esc(String(dec.action).replace(/_/g,' '))}</span>
        ${dec.moves_money?`<span class="pill bad">moves money</span>`:'<span class="pill ok">no money</span>'}${dec.requires_human?'<span class="pill warn">requires human</span>':''}${refused?'<span class="pill bad">proposal refused by guard</span>':''}${ledgerBlocked?`<span class="pill bad">ledger refused</span>`:''}</div>
      <p class="rationale">${esc(dec.rationale)}</p>
      <div class="facts">
        ${dec.moves_money?`<div class="fact money"><div class="k">Amount</div><div class="v">${money(dec.amount_minor, cur)}</div><div class="small muted">${esc(dec.amount_minor)} minor units</div></div>
        <div class="fact"><div class="k">Destination</div><div class="v mono">${esc(dest||'unknown')}</div></div>`:''}
        <div class="fact"><div class="k">Saw (evidence refs)</div><div class="v mono">${(dec.evidence_refs||[]).length?esc(dec.evidence_refs.join(', ')):'none'}</div></div>
        <div class="fact"><div class="k">Did not see (sealed as missing)</div><div class="v mono">${missing.length?esc(missing.join(', ')):'nothing missing'}</div></div>
        <div class="fact"><div class="k">Confidence</div><div class="v">${esc(dec.confidence)}</div></div>
        ${dec.source!=='rules'?`<div class="fact"><div class="k">Model</div><div class="v">${esc(dec.model?.provider||'')} / ${esc(dec.model?.id||'')}<div class="small muted">${esc(dec.model?.mode||'')} · ${esc(dec.usage?.tool_calls||0)} tool calls · ${esc(dec.usage?.prompt_tokens||0)}+${esc(dec.usage?.completion_tokens||0)} tokens · ${esc(dec.usage?.duration_ms||0)} ms</div></div></div>
        <div class="fact"><div class="k">Cost</div><div class="v">${esc(costLabel(dec.usage?.cost_micro_usd, dec.model?.mode))}</div></div>`:''}
      </div>
      ${refused?`<div class="callout bad"><b>Why the proposal was refused:</b> ${human(refused)}. The sealed decision is the escalation, with the evidence the agent did and did not see preserved. The original proposal is kept separately as an unsealed diagnostic and carries no authority.</div>`:''}
      ${ledgerBlocked?`<div class="callout warn"><b>Test ledger refused the refund:</b> ${human(ledgerBlocked)}. The refusal itself was sealed; no permit and no effect exist for this case.</div>`:''}
      ${dec.proposal?`<details><summary>${refused?'Refused proposal':'Model proposal'} (unsealed diagnostic, not authority)</summary><div class="in"><pre>${esc(JSON.stringify(dec.proposal,null,1))}</pre></div></details>`:''}
      ${deniedBlock(dec)}
      ${c.status!=='awaiting_human' && dec.moves_money ? financialBlock(x, cur, dest) : ''}
     ` : '<div class="muted">no decision yet</div>'}
    </div></section>
    <section class="card"><div class="hd"><h3>Permit and test effect</h3><span class="pill info">sandbox</span></div><div class="bd">
      ${p ? `<div class="facts" style="margin-top:0">
        <div class="fact money"><div class="k">Permit amount</div><div class="v">${money(p.amount_minor,p.currency)}</div></div>
        <div class="fact"><div class="k">To</div><div class="v mono">${esc(p.recipient)}</div></div>
        <div class="fact"><div class="k">Status</div><div class="v"><span class="pill ${p.status==='consumed'?'ok':'info'}">${esc(p.status)}</span></div></div>
        <div class="fact"><div class="k">Authorized by</div><div class="v">${esc(p.authorized_by)}</div></div>
        <div class="fact"><div class="k">Permit id</div><div class="v mono">${esc(p.permit_id)}</div></div>
        <div class="fact"><div class="k">Valid until</div><div class="v">${fmtTime(p.expires_at)}</div><div class="small muted">${p.status==='consumed'?'consumed':clockSpan('permit:'+p.permit_id,p.remaining_seconds)+' (server-computed)'}</div></div></div>
        <div class="small muted" style="margin-top:8px">single use · bound to seal <span class="mono">${esc(p.commitment)}</span>${p.approval_commitment?` · approval <span class="mono">${esc(p.approval_commitment)}</span>`:''}</div>` : '<div class="muted small">no permit: nothing can move</div>'}
      ${rc ? `<div class="callout ${rc.verification==='intact'?'ok':rc.verification==='tampered'?'bad':'info'}"><b>Receipt</b> <span class="mono">${esc(rc.receipt_id)}</span> · ${esc(rc.status)} · ${money(rc.amount_minor,rc.currency)} to <span class="mono">${esc(rc.recipient)}</span> · ledger ref <span class="mono">${esc(rc.ledger_ref)}</span> · ${fmtTime(rc.effect_at)} · receipt verification: <b>${esc(rc.verification||'unverifiable')}</b></div>` : ''}
    </div></section>
    <section class="card"><div class="hd"><h3>Timeline</h3></div><div class="bd"><ul class="tl">${(d.events||[]).map(e=>`<li><span class="at">${fmtTime(e.at)}</span><span><b>${esc(e.kind)}</b> ${esc(e.detail||'')}${e.ref?` <span class="mono muted">${esc(e.ref)}</span>`:''}</span></li>`).join('')||'<li class="muted">no events</li>'}</ul></div></section>
   </div>
   <div class="stack">
    <section class="card"><div class="hd"><h3>Seals (chain)</h3><span class="muted small">${(d.seals||[]).length} record${(d.seals||[]).length===1?'':'s'}</span></div><div class="bd">${(d.seals||[]).length ? d.seals.map(sealCard).join('') : '<div class="muted small">not sealed yet</div>'}</div></section>
    <section class="card"><div class="hd"><h3>Time machine</h3><span class="muted small">sealed context and actual tool outputs</span></div><div class="bd" id="replay"><div class="muted small">loading…</div></div></section>
   </div>
  </div>`;
  bindActions($('#detail'));
  if(!changed) window.scrollTo(0, scrollY);
  if(pendingNote && $('#note')) $('#note').value=pendingNote;
  if(noteFocused && $('#note')) $('#note').focus({preventScroll:true});
  restoreDisclosures(openDetails);
  if(changed && userAction && !window.matchMedia('(max-width:980px)').matches) window.scrollTo({top:0});

  const r = await api('/cases/'+encodeURIComponent(id)+'/replay');
  if(state.current!==id || request!==state.detailRequest) return;
  const box = $('#replay'); if(!box) return;
  if(!r.ok){ state.detailSig=''; box.innerHTML = `<div class="muted small">Replay unavailable: ${human(r.reason)}</div>`; return; }
  box.innerHTML = `<details open><summary>Normalized inputs sealed by the server</summary><div class="in"><pre>${esc(JSON.stringify(c.input, null, 1))}</pre></div></details>
   ${(r.tool_calls||[]).map(t=>`<details><summary><span class="tool"><span class="seq">${esc(t.seq)}</span><span class="name">${esc(t.name)}</span><span class="ms">${esc(t.duration_ms)} ms · ${fmtTime(t.at)}</span></span></summary><div class="in">${t.args?`<div class="small muted" style="margin:6px 0 4px">arguments</div><pre>${esc(JSON.stringify(t.args,null,1))}</pre>`:''}<div class="small muted" style="margin:6px 0 4px">output</div><pre>${esc(JSON.stringify(t.output, null, 1))}</pre></div></details>`).join('') || '<div class="muted small" style="margin-top:8px">no tool calls (decided by rules)</div>'}`;
  restoreDisclosures(openDetails);
}

/* ---------- financial read model (verified seal inputs; never an authorization) ---------- */
state.windows = state.windows || Object.create(null);
function rememberWindows(d){
  const fin=d.review, permit=d.permit, at=performance.now();
  if(fin) state.windows['stage:'+(fin.source_commitment||d.case.commitment)]={seconds:fin.stage_remaining_seconds,at};
  if(permit) state.windows['permit:'+permit.permit_id]={seconds:permit.remaining_seconds,at};
}
function windowLeft(key, seconds){
  const w=state.windows[key];
  if(!w || w.seconds==null) return seconds==null?null:Math.max(0,seconds);
  return Math.max(0,w.seconds-Math.floor((performance.now()-w.at)/1000));
}
function clockSpan(key, seconds){ return `<span data-window-key="${esc(key)}">${esc(fmtLeft(windowLeft(key,seconds)))}</span>`; }
function refreshWindows(){
  document.querySelectorAll('[data-window-key]').forEach(el=>{el.textContent=fmtLeft(windowLeft(el.dataset.windowKey,null));});
}
function fmtLeft(sec){ if(sec==null) return 'not staged'; if(sec<=0) return 'expired'; const m=Math.floor(sec/60), r=sec%60; return (m?m+' min ':'')+r+' s left'; }
function financialBlock(x, cur, dest){
  const {c,dec,fin,p} = x;
  if(!fin) return '';
  if(fin.verified!==true) return `<div class="callout warn" style="margin-top:12px"><b>Financial facts unavailable:</b> ${esc(human(fin.reason||'review_snapshot_unavailable'))}. Nothing here is taken from the editable case input.</div>`;
  const ccy = fin.currency || cur;
  const pays = (fin.payments||[]);
  const delta = fin.delta_minor;
  const deltaTxt = delta==null ? 'unknown' : (Number(delta)>0?'+':'')+money(delta, ccy);

  const missingTarget = dec && dec.missing && Object.prototype.hasOwnProperty.call(dec.missing,'refund_target');
  return `<div class="facts" style="margin-top:12px">
    <div class="fact"><div class="k">Order</div><div class="v">${fin.order?.amount_minor!=null?money(fin.order.amount_minor, fin.order.currency||ccy):'unknown'}</div></div>
    <div class="fact"><div class="k">Pix received (${pays.length})</div><div class="v">${pays.length?pays.map(q=>`<div>${q.amount_minor!=null?money(q.amount_minor, ccy):'unknown'} <span class="mono muted">${esc(q.payment_ref||'ref unknown')}</span></div>`).join(''):'none'}</div></div>
    <div class="fact"><div class="k">Delta (payments minus order)</div><div class="v">${esc(deltaTxt)}</div><div class="small muted">observation only, not an authorization${(fin.comparison_issues||[]).length?' · '+esc(fin.comparison_issues.join(', ')):''}</div></div>
    <div class="fact"><div class="k">Destination</div><div class="v mono">${esc(fin.recipient_ref||'unknown')}</div></div>
    <div class="fact"><div class="k">Refund target</div><div class="v mono">${fin.refund_payment_ref?esc(fin.refund_payment_ref):(missingTarget?'<span class="pill bad">not derivable (sealed as missing)</span>':'none')}</div></div>
    <div class="fact"><div class="k">Review window</div><div class="v">${c.status==='awaiting_human'?clockSpan('stage:'+(fin.source_commitment||c.commitment),fin.stage_remaining_seconds):'review completed'}</div><div class="small muted">stage TTL ${esc(fin.stage_ttl_seconds||600)} s, computed by the server${p?' · permit: '+(p.status==='consumed'?'consumed':clockSpan('permit:'+p.permit_id,p.remaining_seconds))+' (separate)':''}</div></div>
  </div>
  <div class="small muted" style="margin-top:6px">Source: ${esc(fin.source||'verified decision seal')} · commitment <span class="mono">${esc(fin.source_commitment||'')}</span> · verified = local seal check only.</div>`;
}
function deniedBlock(dec){
  if(!dec || dec.denied_tool_calls_available!==true) return '';
  const list = dec.denied_tool_calls||[];
  if(!list.length) return '';
  return `<details><summary>Tool calls denied by policy (${list.length}) · unsealed log excerpt, not authoritative</summary><div class="in"><ul class="tl">${list.map(t=>`<li><span class="at">${fmtTime(t.at)}</span><span><b class="mono">${esc(t.tool)}</b> ${esc(human(t.reason_code))}</span></li>`).join('')}</ul><div class="small muted" style="margin-top:6px">These are denials recorded by the authorization policy before the decision; they are kept apart from the tool outputs the agent actually saw and are not part of the seal.</div></div></details>`;
}
function reviewCard(x, cur, dest){
  const {c,dec,kind,ledgerBlocked} = x;
  const can = state.me.can_review;
  const noTarget = dec && dec.missing && Object.prototype.hasOwnProperty.call(dec.missing,'refund_target');
  const amount = kind==='money' ? `<div class="amount"><span class="big">${money(dec.amount_minor, cur)}</span><span class="to">to <span class="mono">${esc(x.fin?.verified===true?(x.fin.recipient_ref||'unknown'):'unknown')}</span></span><span class="pill info">TEST ledger</span>${noTarget?'<span class="pill bad">refund binding incomplete (sealed as missing)</span>':''}</div>` :
    kind==='blocked' ? `<div class="amount"><span class="big" style="text-decoration:line-through;opacity:.6">${money(dec.amount_minor, cur)}</span><span class="to">refund refused by the test ledger</span></div>` :
    `<div class="amount"><span class="big">No money</span><span class="to">escalation only</span></div>`;
  const explain = kind==='money' ? `Approving records your IRIS login in the test ledger, completes the native Workflow task, seals the approval, issues a single-use permit bound to this seal and executes the TEST effect once.` :
    kind==='blocked' ? `The test ledger refused this refund (${human(ledgerBlocked)}). Approving only acknowledges the sealed decision: no permit, no effect. Rejecting records a rejection.` :
    `This decision moves no money. Approving acknowledges the escalation (sealed, no permit, no effect) so the case can be handled outside this flow; rejecting records a rejection.`;
  return `<section class="card review" id="review"><div class="hd"><h3>Review</h3><span class="muted small">as ${esc(state.me.user||'anonymous')}</span></div><div class="bd">
    ${amount}
    <div class="commit small muted">You are approving exactly this sealed decision: <span class="mono">${esc(c.commitment)}</span></div>
    ${financialBlock(x, cur, dest)}
    ${can ? `<input class="note" id="note" type="text" placeholder="note for the sealed approval (optional)" style="margin-top:12px">
      <div class="actions"><button class="btn primary" data-review-action="Approve">${kind==='money'?'Approve refund':'Acknowledge'}</button><button class="btn danger" data-review-action="Reject">Reject</button></div>
      <div class="small muted" style="margin-top:8px">${explain} The request carries the commitment shown above; if the case changed since you opened it, the server refuses.</div>`
      : `<div class="callout warn" style="margin-top:12px">Your login lacks <b>PBPReview:U</b>. Sign in as a reviewer to approve or reject; this console never bypasses that check.</div>`}
    <div id="review-result"></div></div></section>`;
}
function focusReview(){ const r=$('#review'); if(r){ r.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); const n=$('#note'); if(n) n.focus(); } }
async function submitReviewAction(action){
  const note=$('#note')?.value||'', caseId=state.current, commitment=state.commitment;
  if(!state.commitment){ $('#review-result').innerHTML = '<div class="verdict warn">no sealed decision shown; reload the case</div>'; return; }
  document.querySelectorAll('#review .btn').forEach(b=>b.disabled=true);
  const r = await api('/review/'+encodeURIComponent(caseId), {method:'POST', body: JSON.stringify({action,note,commitment})});
  if(state.current!==caseId || state.commitment!==commitment) return;
  $('#review-result').innerHTML = `<div class="verdict ${r.ok?'ok':'bad'}">${r.ok ? (action==='Approve'?'Approved':'Rejected')+' by '+esc(r.user)+(r.ledger_state?' · ledger '+esc(r.ledger_state):'') : 'refused: '+human(r.reason)}</div>`;
  if(!r.ok) document.querySelectorAll('#review .btn').forEach(b=>b.disabled=false);
  toast(r.ok ? (action==='Approve'?'Approval sealed':'Rejection sealed') : 'Review refused');
  if(r.ok) setTimeout(()=>{if(state.current!==caseId) return;state.detailSig='';openCase(caseId,false);loadStats();loadCases();},1500);
}
async function showRecord(c){ const s = await api('/seals/'+c); const box = $('#tamper-'+c); if(!box) return; box.innerHTML = s.ok||s.record ? `<pre style="margin-top:8px">${esc(JSON.stringify(s.record, null, 1))}</pre>` : `<div class="verdict warn">${human(s.reason)}</div>`; }
async function tamper(c){ const s = await api('/seals/'+c); const box = $('#tamper-'+c); if(!box) return;
  if(!(s.ok||s.record)){ box.innerHTML = `<div class="verdict warn">${human(s.reason)}</div>`; return; }
  box.innerHTML = `<div class="small muted" style="margin:8px 0 6px">Edit anything in this COPY of the sealed record (amount, rationale, a missing field, a tool output) and verify it against the stored commitment. The stored record is never touched.</div>
   <textarea id="ta-${c}" aria-label="Editable copy of the sealed record">${esc(JSON.stringify(s.record, null, 1))}</textarea><div class="acts"><button class="btn primary sm" data-verify="${esc(c)}">Verify this copy</button></div><div id="v-${c}"></div>`; bindActions(box); }
async function verify(c){ const editor=$('#ta-'+c), verdict=$('#v-'+c); if(!editor||!verdict) return; let rec; try{rec=JSON.parse(editor.value);}catch(e){verdict.innerHTML='<div class="verdict warn">not valid JSON</div>';return;}
  const r = await api('/seals/'+c+'/verify', {method:'POST', body: JSON.stringify({record: rec})});
  verdict.innerHTML = `<div class="verdict ${r.state==='intact'?'ok':r.state==='tampered'?'bad':'warn'}">${esc(r.state||r.reason)}${r.state==='tampered'?' · this copy differs from what was sealed':r.state==='intact'?' · identical to the sealed record':''}</div>`; }
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- refresh loop: keeps selection, scroll and open disclosures ---------- */
async function refresh(){ await Promise.all([loadHealth(), loadStats(), loadCases()]); }
bindActions();
refresh();
setInterval(refreshWindows,1000);
setInterval(()=>{ if(document.hidden) return; loadStats(); loadCases(); if(state.current) openCase(state.current,false); }, 5000);
</script>
</body>
</html>
